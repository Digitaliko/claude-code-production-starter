name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Clearly fake values. Real secrets never go into CI for tests.
  APP_ENV: ci
  EXAMPLE_API_KEY: ci-dummy-not-a-real-key

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
      - id: app
        run: |
          if [ -f package.json ]; then echo "app=true" >> "$GITHUB_OUTPUT"
          else echo "app=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package.json yet, app jobs skipped"; fi

  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/gate-selftest.sh

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Lint ratchet (suppressions may only shrink)
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash scripts/lint-ratchet.sh "$BASE"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:int

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  red-proof:
    needs: changes
    # Label a PR `skip-red-proof` for a change no test can prove (pure refactor, config).
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-red-proof')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Changed tests fail on the base and pass here
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash scripts/gate.sh red-proof "$BASE"

  # The one check to require in branch protection. Skipped jobs (docs-only PRs) count as fine.
  ci:
    needs: [gate-selftest, check, test, build, e2e, red-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
