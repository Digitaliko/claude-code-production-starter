# Optional: mention @claude in an issue or PR comment to ask for help or a change.
# Needs the ANTHROPIC_API_KEY repository secret and the Claude GitHub app
# (run /install-github-app in Claude Code). Only people with write access can trigger it.
# Its changes land on a branch and go through a PR and CI like anyone else's.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 30
